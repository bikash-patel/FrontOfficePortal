<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard</title>
  <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16x16.png">
  <link rel="manifest" href="images/site.webmanifest">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    .footer {
      position: fixed;
      left: 0;
      bottom: 0;
      width: 100%;
      background-color: white;
      color: black;
      text-align: center;
    }
  </style>
</head>
<body>
<div class="container">
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">
        <img src="images/logo.jpg" alt="Avatar Logo" style="width: 40px;" class="rounded-pill">
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
              data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
              aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link active" href="./dashboard">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="./addenquiry">Add Enquiry</a></li>
          <li class="nav-item"><a class="nav-link" href="./viewenquiry">View Enquiry</a></li>
          <li class="nav-item"><a class="nav-link" href="./course/addcourse">Add Course</a></li>
          <li class="nav-item"><a class="nav-link" href="./course/viewcourse">View Course</a></li>
        </ul>
        <a href="./logout">
          <button type="button" class="btn btn-danger">Logout</button>
        </a>
      </div>
    </div>
  </nav>

  <!-- Dashboard Section -->
  <section class="h-100 gradient-form" style="background-color: #eee;">
    <div class="container py-5 h-100">
      <div class="row d-flex justify-content-center align-items-center h-100">
        <div class="col-xl-10">
          <div class="card rounded-3 text-black">
            <div class="row g-0">
              <!-- Left: Statistics -->
              <div class="col-lg-6">
                <div class="card-body p-md-5 mx-md-4 text-center">
                  <h5>Your Performance</h5>
                  <h2>
                    Total Enquiries: <span th:text="${response.totalEnquiry}">0</span>
                  </h2>
                  <h4 style="color: green;">
                    Enrolled: <span th:text="${response.enrollStudent}">0</span>
                  </h4>
                  <h4 style="color: red;">
                    Lost: <span th:text="${response.lostStudent}">0</span>
                  </h4>
                  <h4 style="color: #0d6efd;">
                    Pending: <span th:text="${response.totalEnquiry - (response.enrollStudent + response.lostStudent)}">0</span>
                  </h4>

                  <!-- Chart.js Donut -->
                  <canvas id="donutChart" width="200" height="200"></canvas>
                </div>
              </div>

              <!-- Right: Image -->
              <div class="col-lg-6 d-flex align-items-center">
                <div class="text-white px-3 py-4 p-md-5 mx-md-4">
                  <img alt="Leady" src="images/leady.png" height="300px" width="300px">
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>

<!-- Footer -->
<div class="footer">
  <p class="text-center">© 2025 Crazy Coding, Inc.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:inline="javascript">
  let total = /*[[${response.totalEnquiry}]]*/ 0;
  let enrolled = /*[[${response.enrollStudent}]]*/ 0;
  let lost = /*[[${response.lostStudent}]]*/ 0;
  let pending = total - (enrolled + lost);

  const ctx = document.getElementById('donutChart').getContext('2d');
  const donutChart = new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels: ['Enrolled', 'Lost', 'Pending'],
      datasets: [{
        label: 'Enquiry Status',
        data: [enrolled, lost, pending],
        backgroundColor: [
          '#28a745',               // Enrolled - Green
          '#dc3545',               // Lost - Red
          'rgba(13, 110, 253, 0.4)' // Pending - Blurred Blue
        ],
        borderWidth: 1
      }]
    },
    options: {
      //cutout: '75%',
      plugins: {
        legend: {
          position: 'bottom'
        },
        tooltip: {
          callbacks: {
            label: function (context) {
              let value = context.parsed;
              let percent = total > 0 ? ((value / total) * 100).toFixed(1) : 0;
              return `${context.label}: ${value} (${percent}%)`;
            }
          }
        }
      }
    }
  });
</script>
</body>
</html>
