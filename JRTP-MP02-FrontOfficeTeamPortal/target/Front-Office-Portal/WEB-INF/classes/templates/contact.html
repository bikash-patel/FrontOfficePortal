<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Us</title>
  <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16x16.png">
  <link rel="manifest" href="images/site.webmanifest">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      padding-top: 70px; /* Ensures content is not hidden behind fixed navbar */
    }

    .footer {
      position: fixed;
      left: 0;
      bottom: 0;
      width: 100%;
      background-color: white;
      color: black;
      text-align: center;
    }

    .gradient-custom-2 {
      background: linear-gradient(to right, #ee7724, #d8363a, #dd3675, #b44593);
      color: white;
    }

    .btn-custom {
      background: linear-gradient(to right, #ee7724, #d8363a, #dd3675, #b44593);
      color: white;
      border: none;
    }

    .btn-custom:hover {
      opacity: 0.9;
      color: white;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- Fixed Navbar (matching Home page) -->
  <nav class="navbar navbar-expand-lg bg-body-tertiary fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">
        <img src="images/logo.jpg" alt="Avatar Logo" style="width:40px;" class="rounded-pill"> 
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="./">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Services</a></li>
          <li class="nav-item"><a class="nav-link" href="./course/viewcoursepublic">Courses</a></li>
          <li class="nav-item"><a class="nav-link active" aria-current="page" href="/contact">Contact Us</a></li>
        </ul>
        <a href="./login"><button type="button" class="btn btn-danger">Login</button></a>
      </div>
    </div>
  </nav>
</div>

<!-- Contact Section -->
<section class="h-100 gradient-form" style="background-color: #eee;">
  <div class="container py-5 h-100">
    <div class="row d-flex justify-content-center align-items-center h-100">
      <div class="col-xl-10">
        <div class="card rounded-3 text-black">
          <div class="row g-0">
            <div class="col-lg-6">
              <div class="card-body p-md-5 mx-md-4">

                <div class="text-center">
                  <img src="images/logo.png" style="width: 185px;" alt="logo">
                  <h4 class="mt-1 mb-4 pb-1">Contact Us</h4>
                </div>

                <form>
                  <div class="form-outline mb-4">
                    <label class="form-label" for="name">Full Name</label>
                    <input type="text" id="name" class="form-control" placeholder="Your full name" />
                  </div>

                  <div class="form-outline mb-4">
                    <label class="form-label" for="email">Email address</label>
                    <input type="email" id="email" class="form-control" placeholder="name@example.com" />
                  </div>

                  <div class="form-outline mb-4">
                    <label class="form-label" for="subject">Subject</label>
                    <input type="text" id="subject" class="form-control" placeholder="Subject of your message" />
                  </div>

                  <div class="form-outline mb-4">
                    <label class="form-label" for="message">Your Message</label>
                    <textarea id="message" class="form-control" rows="4" placeholder="Write your message here..."></textarea>
                  </div>

                  <div class="text-center pt-1 mb-5 pb-1">
                    <button type="submit" class="btn btn-custom btn-block mb-3">Send Message</button>
                  </div>
                </form>

              </div>
            </div>

            <div class="col-lg-6 d-flex align-items-center gradient-custom-2">
              <div class="text-white px-3 py-4 p-md-5 mx-md-4">
                <h5 class="mb-4">Get in Touch</h5>
                <p><strong>Address:</strong> Bargarh Road, Odisha, India</p>
                <p><strong>Email:</strong> bikashpatel506@gmail.com</p>
                <p><strong>Phone:</strong> +91 9668453230</p>
                <iframe src="https://www.google.com/maps?q=21.3470154,83.6320212&z=17&output=embed" width="100%" height="250" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
              </div>
            </div>

          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<div class="footer">
  <p class="text-center">© 2025 Crazy Coding, Inc.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
