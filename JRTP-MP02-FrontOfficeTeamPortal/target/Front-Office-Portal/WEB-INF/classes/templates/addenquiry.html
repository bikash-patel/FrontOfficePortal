<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AddEnquiry</title>
    <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16x16.png">
    <link rel="manifest" href="images/site.webmanifest">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
      .footer {
        position: fixed;
        left: 0;
        bottom: 0;
        width: 100%;
        background-color: white;
        color: black;
        text-align: center;
      }
      .btn-custom-gradient {
        background: linear-gradient(to right, #ee7724, #d8363a, #dd3675, #b44593);
        color: white;
        border: none;
        border-radius: 6px;
        padding: 10px 30px;
        font-weight: bold;
      }
      .btn-custom-gradient:hover {
        background: linear-gradient(to right, #b44593, #dd3675, #d8363a, #ee7724);
        color: white;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
          <a class="navbar-brand" href="#">
            <img src="images/logo.jpg" alt="Avatar Logo" style="width:40px;" class="rounded-pill"> 
          </a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
              <li class="nav-item"><a class="nav-link active" href="./dashboard">Home</a></li>
              <li class="nav-item"><a class="nav-link" href="./addenquiry">Add Enquiry</a></li>
              <li class="nav-item"><a class="nav-link" href="./viewenquiry">View Enquiry</a></li>
              <li class="nav-item"><a class="nav-link" href="./course/addcourse">Add Course</a></li>
              <li class="nav-item"><a class="nav-link" href="./course/viewcourse">View Course</a></li>
            </ul>
            <a href="./logout">
              <button type="button" class="btn btn-danger">Logout</button>
            </a>
          </div>
        </div>
      </nav>

      <section class="h-100 gradient-form" style="background-color: #eee;">
        <div class="container py-5 h-100">
          <div class="row d-flex justify-content-center align-items-center h-100">
            <div class="col-xl-10">
              <div class="card rounded-3 text-black">
                <div class="row g-0">
                  <div class="col-lg-6">
                    <div class="card-body p-md-5 mx-md-4">
                      <form th:action="@{/addenquiry}" method="POST" th:object="${enquiry}">
                        <h5>Add Student Enquiry Here</h5>
                        <p class="text-success" th:text="${successMsg}"></p>
                        
                        <!-- Student Name -->
                        <div class="form-outline mb-4">
                          <label>Student Name</label>
                          <input type="text" class="form-control" placeholder="first last" th:field="*{studentName}" required>
                        </div>

                        <!-- Email ID -->
                        <div class="form-outline mb-4">
                          <label>Email ID</label>
                          <input type="email" class="form-control" placeholder="example@gmail.com" th:field="*{studentMailId}" required>
                        </div>

                        <!-- Mobile Number -->
                        <div class="form-outline mb-4">
                          <label>Mobile Number</label>
                          <input type="number" class="form-control" th:field="*{studPhoneNumber}" required>
                        </div>

                        <!-- Course Dropdown (first) -->
                        <div class="form-outline mb-4">
                          <label>Course</label>
                          <select id="courseSelect" th:field="*{courseName}" class="form-control" required>
                            <option value="">-Select-</option>
                            <th:block th:each="course : ${courses}">
                              <option th:value="${course}" th:text="${course}"></option>
                            </th:block>
                          </select>
                        </div>

                        <!-- Class Mode Dropdown (disabled until course chosen) -->
                        <div class="form-outline mb-4">
                          <label>Class Mode</label>
                          <select id="classModeSelect" th:field="*{classMode}" class="form-control" required disabled>
                            <option value="">-Select-</option>
                          </select>
                        </div>

                        <!-- Enquiry Status -->
                        <div class="form-outline mb-4">
                          <label>Enquiry Status</label>
                          <select th:field="*{enquiryStatus}" class="form-control" required>
                            <option value="">-Select-</option>
                            <th:block th:each="status : ${statuses}">
                              <option th:value="${status}" th:text="${status}"></option>
                            </th:block>
                          </select>
                        </div>

                        <div class="text-center pt-1 mb-5 pb-1">
                          <button type="submit" class="btn btn-custom-gradient">Submit</button>
                        </div>
                      </form>
                    </div>
                  </div>
                  <div class="col-lg-6 d-flex align-items-center gradient-custom-2">
                    <div class="text-white px-3 py-4 p-md-5 mx-md-4">
                      <img alt="" src="images/leady.png" height="400px" width="300px">
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </div>

    <div class="footer">
      <p class="text-center">© 2025 Crazy Coding, Inc.</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JS to load Class Modes dynamically -->
    <script>
    document.getElementById('courseSelect').addEventListener('change', function () {
        let courseName = this.value;
        let classModeSelect = document.getElementById('classModeSelect');

        // Reset and disable initially
        classModeSelect.innerHTML = '<option value="">-Select-</option>';
        classModeSelect.disabled = true;

        if (courseName) {
            // Show loading message
            let loadingOption = document.createElement('option');
            loadingOption.textContent = 'Loading...';
            loadingOption.disabled = true;
            loadingOption.selected = true;
            classModeSelect.appendChild(loadingOption);

            fetch('/course/getCourseModes?courseName=' + encodeURIComponent(courseName))
                .then(response => response.json())
                .then(modes => {
                    classModeSelect.innerHTML = '<option value="">-Select-</option>';
                    modes.forEach(mode => {
                        let option = document.createElement('option');
                        option.value = mode;
                        option.textContent = mode;
                        classModeSelect.appendChild(option);
                    });
                    classModeSelect.disabled = false;
                })
                .catch(error => {
                    console.error('Error fetching course modes:', error);
                    classModeSelect.innerHTML = '<option value="">-Select-</option>';
                    classModeSelect.disabled = true;
                });
        }
    });
    </script>
  </body>
</html>
