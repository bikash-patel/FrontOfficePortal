<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>View Courses</title>

<link rel="apple-touch-icon" sizes="180x180"
	href="images/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32"
	href="images/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16"
	href="images/favicon-16x16.png">
<link rel="manifest" href="images/site.webmanifest">

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
<script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>

<style>
.footer {
	position: fixed;
	left: 0;
	bottom: 0;
	width: 100%;
	background-color: white;
	color: black;
	text-align: center;
}
</style>
</head>

<body>
	<div class="container">
		<!-- NAVBAR -->
		<nav class="navbar navbar-expand-lg bg-body-tertiary">
			<div class="container-fluid">
				<a class="navbar-brand" href="#"> <img src="/images/logo.jpg"
					alt="Avatar Logo" style="width: 40px;" class="rounded-pill">
				</a>
				<button class="navbar-toggler" type="button"
					data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent">
					<span class="navbar-toggler-icon"></span>
				</button>

					<div class="collapse navbar-collapse" id="navbarSupportedContent">
					<ul class="navbar-nav me-auto mb-2 mb-lg-0">
						<li class="nav-item"><a class="nav-link active" aria-current="page" href="/dashboard">Home</a></li>
						<li class="nav-item"><a class="nav-link" href="/addenquiry">Add Enquiry</a></li>
						<li class="nav-item"><a class="nav-link" href="/viewenquiry">View Enquiry</a></li>
						<li class="nav-item"><a class="nav-link" href="./addcourse">Add Course</a></li>
						<li class="nav-item"><a class="nav-link" href="./viewcourse">View Course</a></li>
					</ul>
					<a href="/logout">
						<button type="button" class="btn btn-danger">Logout</button>
					</a>
				</div>
			</div>
		</nav>

		<!-- PAGE HEADER -->
		<h4 class="text-center mt-4">View Available Courses</h4>
		<p th:if="${successMsg}" th:text="${successMsg}"
			class="text-success text-center fw-bold"></p>
		<hr>

		<!-- COURSE TABLE -->
		<table class="table table-striped table-hover">
			<thead>
				<tr>
					<th>#</th>
					<th>Course Name</th>
					<th>Duration</th>
					<th>Fee</th>
					<th>Action</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="course, iterStat : ${courseList}">
					<td th:text="${iterStat.count}"></td>
					<td th:text="${course.courseName}"></td>
					<td th:text="${course.duration}"></td>
					<td th:text="${course.fees}"></td>
					<td><a th:href="@{/course/editcourse(courseId=${course.courseId})}">
							<button class="btn btn-primary btn-sm">Edit</button>
					</a> <a th:href="@{/course/deletecourse(courseId=${course.courseId})}"
						onclick="return confirm('Are you sure?')">
							<button class="btn btn-danger btn-sm">Delete</button>
					</a></td>
				</tr>
			</tbody>

		</table>
	</div>

	<!-- FOOTER -->
	<div class="footer">
		<p class="text-center">© 2025 Crazy Coding, Inc.</p>
	</div>

	<!-- Bootstrap JS -->
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
