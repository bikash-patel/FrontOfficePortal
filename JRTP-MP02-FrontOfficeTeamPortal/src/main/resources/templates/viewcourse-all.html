<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>View Courses</title>

  <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png">
  <link rel="manifest" href="/images/site.webmanifest">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    body {
      padding-top: 70px;
    }

    .footer {
      position: fixed;
      left: 0;
      bottom: 0;
      width: 100%;
      background-color: white;
      color: black;
      text-align: center;
    }

    .course-card {
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .course-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
    }

    .card-header {
      background: linear-gradient(to right, #ee7724, #d8363a, #dd3675, #b44593);
      color: white;
      font-weight: bold;
      font-size: 1.1rem;
      padding: 0.6rem;
    }

    .bi {
      margin-right: 6px;
    }

    .enroll-btn {
      background: linear-gradient(to right, #ee7724, #d8363a, #dd3675, #b44593);
      border: none;
      color: white;
      font-weight: 500;
      font-size: 0.85rem;
      padding: 4px 12px;
      border-radius: 50px;
      text-decoration: none;
      display: inline-block;
      transition: background 0.3s ease, transform 0.2s ease;
    }

    .enroll-btn:hover {
      background: linear-gradient(to right, #b44593, #dd3675, #d8363a, #ee7724);
      color: white;
      transform: scale(1.05);
      text-decoration: none;
    }
  </style>
</head>

<body>
  <div class="container">
    <!-- Navbar identical to Home page -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary fixed-top">
      <div class="container-fluid">
        <a class="navbar-brand" href="/">
          <img src="/images/logo.jpg" alt="Avatar Logo" style="width:40px;" class="rounded-pill"> 
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item"><a class="nav-link active" href="/">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="#">Services</a></li>
            <li class="nav-item"><a class="nav-link" href="/course/viewcoursepublic">Courses</a></li>
            <li class="nav-item"><a class="nav-link" href="/contact">Contact Us</a></li>
          </ul>
          <a href="/login"><button type="button" class="btn btn-danger">Login</button></a>
        </div>
      </div>
    </nav>

    <!-- PAGE HEADER -->
    <h4 class="text-center mt-4 mb-3">🎓 View Available Courses</h4>
    <p th:if="${successMsg}" th:text="${successMsg}" class="text-success text-center fw-bold"></p>
    <hr>

    <!-- COURSE CARDS -->
    <div class="row row-cols-1 row-cols-md-3 g-4" th:if="${courseList}">
      <div class="col" th:each="course : ${courseList}">
        <div class="card h-100 course-card border-0 shadow-sm">
          <div class="card-header text-white text-center" th:text="${course.courseName}">Course Name</div>
          <div class="card-body">
            <p class="card-text">
              <i class="bi bi-clock-fill text-primary"></i><strong> Duration:</strong> <span th:text="${course.duration}"></span><br>
              <i class="bi bi-currency-rupee text-success"></i><strong> Fee:</strong> ₹<span th:text="${course.fees}"></span><br>
              <i class="bi bi-calendar-event text-warning"></i><strong> Start Date:</strong>
              <span th:text="${#temporals.format(course.startDate, 'dd-MM-yyyy')}"></span>
            </p>
          </div>
          <div class="card-footer bg-white text-center">
            <a href="#" class="enroll-btn">Enroll Now</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- FOOTER -->
  <div class="footer">
    <p class="text-center">© 2025 Crazy Coding, Inc.</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
