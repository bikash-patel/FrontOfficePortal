<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EditEnquiry</title>
<link rel="apple-touch-icon" sizes="180x180"
	href="images/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32"
	href="images/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16"
	href="images/favicon-16x16.png">
<link rel="manifest" href="images/site.webmanifest">
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet"
	integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
	crossorigin="anonymous">
<style>
.footer {
	position: fixed;
	left: 0;
	bottom: 0;
	width: 100%;
	background-color: white;
	color: black;
	text-align: center;
}

.btn-custom-gradient {
	background: linear-gradient(to right, #ee7724, #d8363a, #dd3675, #b44593);
	color: white;
	border: none;
	border-radius: 6px;
	padding: 10px 30px;
	font-weight: bold;
}

.btn-custom-gradient:hover {
	background: linear-gradient(to right, #b44593, #dd3675, #d8363a, #ee7724);
	color: white;
}
</style>
</head>
<body>
	<div class="container">
		<nav class="navbar navbar-expand-lg bg-body-tertiary">
			<div class="container-fluid">
				<a class="navbar-brand" href="#"> <img src="images/logo.jpg"
					alt="Avatar Logo" style="width: 40px;" class="rounded-pill">
				</a>
				<button class="navbar-toggler" type="button"
					data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
					aria-controls="navbarSupportedContent" aria-expanded="false"
					aria-label="Toggle navigation">
					<span class="navbar-toggler-icon"></span>
				</button>
				<div class="collapse navbar-collapse" id="navbarSupportedContent">
					<ul class="navbar-nav me-auto mb-2 mb-lg-0">
						<li class="nav-item"><a class="nav-link active"
							aria-current="page" href="./dashboard">Home</a></li>
						<li class="nav-item"><a class="nav-link" href="./addenquiry">Add
								Enquiry</a></li>
						<li class="nav-item"><a class="nav-link" href="./viewenquiry">View
								Enquiry</a></li>
						<li class="nav-item"><a class="nav-link"
							href="./course/addcourse">Add Course</a></li>
						<li class="nav-item"><a class="nav-link"
							href="./course/viewcourse">View Course</a></li>
					</ul>
					<a href="./logout">
						<button type="button" class="btn btn-danger">Logout</button>
					</a>
				</div>
			</div>
		</nav>

		<section class="h-100 gradient-form" style="background-color: #eee;">
			<div class="container py-5 h-100">
				<div
					class="row d-flex justify-content-center align-items-center h-100">
					<div class="col-xl-10">
						<div class="card rounded-3 text-black">
							<div class="row g-0">
								<div class="col-lg-6">
									<div class="card-body p-md-5 mx-md-4">

										<form th:action="@{/editenquirydata}" method="POST"
											th:object="${enquiry}">
											<h5>Edit Student Enquiry Here</h5>
											<p class="text-success" th:text="${successMsg}" />

											<div class="form-outline mb-4">
												<input type="hidden" class="form-control"
													th:field="*{enquiryId}" />
											</div>

											<div class="form-outline mb-4">
												<label>Student Name</label> <input type="text"
													class="form-control" placeholder="first last"
													th:field="*{studentName}" required />
											</div>

											<label>Email ID</label>
											<div class="form-outline mb-4">
												<input type="email" class="form-control"
													placeholder="example@gmail.com" th:field="*{studentMailId}"
													required />
											</div>

											<div class="form-outline mb-4">
												<label>Mobile Number</label> <input type="number"
													class="form-control" th:field="*{studPhoneNumber}" required />
											</div>

											<div class="form-outline mb-4">
												<label>Course</label> <select th:field="*{courseName}"
													class="form-control" required>
													<option value="">-Select-</option>
													<th:block th:each="course : ${courses}">
														<option th:value="${course}" th:text="${course}" />
													</th:block>
												</select>
											</div>
											
											<div class="form-outline mb-4">
												<label>Class Mode</label> <select th:field="*{classMode}"
													class="form-control" required>
													<option value="">-Select-</option>
													<th:block th:each="modes : ${classModes}">
														<option th:value="${modes}" th:text="${modes}" />
													</th:block>
												</select>
											</div>

										<!-- 	<div class="form-outline mb-4">
												<label>Class Mode</label> <select id="classModeSelect"
													th:field="*{classMode}" class="form-control" required>
													<option value="">-Select-</option>
													<th:block th:if="${enquiry.courseName}">
														<th:block th:each="mode : ${courseModes}">
															<option th:value="${mode}" th:text="${mode}"
																th:selected="${mode == enquiry.classMode}"></option>
														</th:block>
													</th:block>
												</select>
											</div> -->



											<!-- <div class="form-outline mb-4">
												<label>Class Mode</label> <select id="classModeSelect"
													th:field="*{classMode}" class="form-control" required>
													<option value="">-Select-</option>
													<option th:each="mode : ${courseModes}" th:value="${mode}"
														th:text="${mode}"></option>
												</select>
											</div> -->





											<div class="form-outline mb-4">
												<label>Enquiry Status</label> <select
													th:field="*{enquiryStatus}" class="form-control" required>
													<option value="">-Select-</option>
													<th:block th:each="status : ${statuses}">
														<option th:value="${status}" th:text="${status}" />
													</th:block>
												</select>
											</div>

											<!-- ✅ Updated Button -->
											<div class="text-center pt-1 mb-5 pb-1">
												<button type="submit" class="btn btn-custom-gradient">Update</button>
											</div>

										</form>

									</div>
								</div>
								<div
									class="col-lg-6 d-flex align-items-center gradient-custom-2">
									<div class="text-white px-3 py-4 p-md-5 mx-md-4">
										<img alt="" src="images/leady.png" height="400px"
											width="300px">
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</section>
	</div>

	<div class="footer">
		<p class="text-center">© 2025 Crazy Coding, Inc.</p>
	</div>

	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
		crossorigin="anonymous"></script>
</body>
</html>
